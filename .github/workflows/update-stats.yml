name: Update terminal stats

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours
  push:
    branches: [main]
  workflow_dispatch:          # manual "Run workflow" button

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Rebuild card from profile.toml
        run: python build_svg.py

      - name: Recompute stats and patch terminal.svg
        run: python update_stats.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_LOGIN: Chase-Fournier
          # upstream projects you contribute to (own forks are skipped to avoid double counting)
          EXTRA_REPOS: atcupps/Jupiterp,Hack4Impact-UMD/new-philippine-nurses-association-of-america,Hack4Impact-UMD/camp-starfish

      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add terminal.svg
          git diff --staged --quiet || git commit -m "chore: refresh terminal stats"
          git push
